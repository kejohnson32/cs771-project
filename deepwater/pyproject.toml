[project]
name = "deepwater"
version = "0.1.0"
description = "Water Level Estimation from Imagery Using Computer Vision"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "scikit-image>=0.21.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "httpx>=0.24.0",
    "pytz>=2023.3",
    "python-dateutil>=2.8.2",
    "dataretrieval>=1.0.0",
    "pyyaml>=6.0",
    "albumentations>=1.3.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.15.0"]
dev = ["ipykernel>=6.25.0", "pytest>=7.4.0"]

[project.scripts]
deepwater = "deepwater.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deepwater"]
